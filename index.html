textarea{min-height:84px;resize:vertical}input[type=checkbox]{width:auto;accent-color:var(--acc)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}

var TIPS={"Бриф и цель":"Запишите в 2–3 предложениях: для кого работа, какую задачу решает и как поймёте, что получилось. Без брифа кейсу нечего доказывать.","Исследование и референсы":"Соберите 15–30 референсов и разложите по группам: цвет, шрифт, композиция, настроение. Сохраняйте в Библиотеку с тегом «референс».","Мудборд и стиль":"Определите стиль, 2–3 основных цвета и пару шрифтов. Зафиксируйте это в одном листе, дальше работа идёт быстрее.","Эскизы и концепты":"Сделайте 3–5 разных направлений быстро и грубо. Показывать в кейсе путь от эскизов к финалу — сильный ход.","Разработка макетов":"Постройте сетку, задайте иерархию размеров текста и держите отступы одинаковыми. Смотрите на макет уменьшенным: читается ли главное?","Применения (мокапы)":"Покажите работу в реальном контексте: упаковка, сайт, печать, соцсети. Единый свет и стиль мокапов делают кейс цельным.","Финал и экспорт":"Экспортируйте в нужных форматах и размерах, исходники храните отдельно. Проверьте шрифты и ссылки на файлы.","Сборка кейса":"Откройте вкладку «Кейс»: обложка, задача, процесс, решение, результат и 5–10 изображений в логичном порядке.","Публикация":"Опубликуйте на Behance, добавьте теги и инструменты. Первые 2–3 изображения решают, будут ли листать дальше.","Идея и референсы":"Определите стиль (реализм, стилизация, low poly) и соберите референсы форм, материалов и света.","Блокинг форм":"Сначала крупные объёмы и пропорции. Проверяйте силуэт со всех сторон.","Детальная модель":"Добавляйте детали постепенно и сохраняйте версии. Фаски на кромках оживляют рендер.","Топология и UV":"Чистая сетка из четырёхугольников и развёртка без растяжений.","Текстуры и материалы":"PBR-материалы: цвет, шероховатость, металличность. Небольшие дефекты (пыль, царапины) добавляют реализма.","Свет и камера":"Начните с трёхточечного света и HDRI. Фокусное 50–85 мм выглядит спокойнее, чем сверхширокий угол.","Рендер и постобработка":"Рендерьте крупно с шумоподавлением, добавьте цветокоррекцию. Покажите clay-рендер и wireframe."};
var ADV=[["Композиция","Иерархия и контраст","Читателю нужно за секунду понять, что главное. Сделайте один главный элемент крупным и контрастным, остальное тише. Прищурьтесь: если главное не видно, иерархия не работает."],["Композиция","Сетка и выравнивание","Работайте по сетке и придерживайтесь одной линии выравнивания. Отступы кратны 8 пунктам. Случайные сдвиги считываются как небрежность."],["Композиция","Воздух решает","Пустое место — не потеря, а инструмент. Группируйте связанное близко, несвязанное разводите шире (принцип близости)."],["Композиция","Правило третей и фокус","Ставьте главный объект на пересечение третей и ведите взгляд линиями, светом и направлением взглядов героев."],["Типографика","Не больше двух шрифтов","Одна гарнитура для заголовков, одна для текста. Иерархию создавайте размером, насыщенностью и цветом, а не десятком шрифтов."],["Типографика","Длина строки и интерлиньяж","Комфортная строка 45–75 знаков, межстрочный 120–150%. Для крупных заголовков интерлиньяж плотнее, 100–115%."],["Типографика","Кернинг и висячие слова","Крупные заголовки вручную проверьте на кернинг. Убирайте висячие предлоги и одинокие слова в конце строки. Капслок разрежайте на 5–10%."],["Типографика","Проверьте лицензию и кириллицу","Убедитесь, что шрифт поддерживает кириллицу и разрешён для коммерческого использования, иначе кейс придётся переделывать."],["Цвет","Правило 60-30-10","60% нейтральный фон, 30% основной цвет, 10% акцент. Так палитра выглядит собранно."],["Цвет","Контраст не ниже 4.5:1","Для текста по стандарту WCAG нужен контраст не менее 4.5:1 (для крупного 3:1). Проверьте и в оттенках серого: если читается, значит иерархия держится не только на цвете."],["Цвет","Печать и экран","Экран: sRGB. Печать: CMYK, насыщенные RGB-цвета в нём тускнеют. Переведите в CMYK заранее и проверьте на пробной печати."],["Брендинг","Логотип должен работать мелко","Проверьте знак в 16–24 px, в одном цвете, на тёмном и светлом фоне. Если теряется, упрощайте."],["Брендинг","Покажите систему, а не картинку","Логотип, цвета, шрифты, паттерны и 3–5 применений (визитка, упаковка, соцсети). Работодатель смотрит, как это работает вместе."],["Брендинг","Векторные форматы","Логотипы сдавайте в SVG/PDF (вектор) и PNG с прозрачным фоном. Шрифты переведите в кривые."],["Печать","Вылеты и безопасная зона","Вылет 3 мм, текст не ближе 3–5 мм от края. Разрешение 300 dpi, режим CMYK, PDF с вложенными шрифтами или кривыми."],["Печать","Чёрный цвет","Мелкий текст — 100% K. Для больших чёрных заливок используют насыщенный чёрный (rich black), уточните значения в типографии."],["Экспорт","Форматы для разных задач","PNG: графика и прозрачность. JPG: фото и обзоры. WebP: веб. SVG/PDF: вектор. Экспортируйте @2x для экранов с высокой плотностью."],["Экспорт","Именование и версии","Называйте файлы по схеме проект_элемент_версия и не затирайте старые версии. Исходники храните отдельно от финалов."],["Портфолио","3–5 лучших кейсов лучше 15 средних","Показывайте работы, на которых хотите получать заказы. Лишние убирайте. Начинайте и заканчивайте сильным."],["Портфолио","Проблема → процесс → результат","В каждом кейсе коротко: какая была задача, как вы шли к решению и что получилось (цифры, отзыв или применение)."],["Портфолио","Первые изображения решают","Обложка и первые 2–3 изображения должны сразу показывать суть. Обложка Behance около 808×632 px, изображения шириной около 1400 px. Сверяйте с актуальными требованиями платформы."],["Портфолио","Единый стиль кейсов","Держите одинаковые отступы, подписи и подачу мокапов, чтобы портфолио выглядело как серия, а не как случайный набор."],["Процесс","Делайте быстро и грубо сначала","Первые варианты в чёрно-белом и без деталей. Детализация после выбора направления экономит часы."],["Процесс","Запрашивайте обратную связь","Покажите 2–3 людям и спросите «что вы видите первым?» вместо «нравится?». Это даёт полезные правки."],["Процесс","Самостоятельные проекты","Если нет клиентов, придумайте бриф сами: ребрендинг существующей компании, плакат к событию, упаковка. Важно показать мышление."],["3D","Сначала силуэт и форма","Хороший объект узнаётся по силуэту. Детали и текстуры не спасут слабую форму."],["3D","Свет делает рендер","Три точки света и HDRI дают больше, чем сложные материалы. Следите за контрастом и направлением света."],["3D","Покажите процесс","В кейсе 3D покажите clay-рендер, сетку (wireframe), текстуры и финальные кадры с разных ракурсов."]];
